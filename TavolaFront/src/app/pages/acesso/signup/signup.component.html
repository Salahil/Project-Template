<app-default-login-layout>
  <div class="card-inner">
    <h2 class="title">Crie sua conta</h2>
    <form [formGroup]="signupForm" class="signup-form" (ngSubmit)="submitForm()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" type="text" />
        <mat-error *ngIf="signupForm.get('name')?.hasError('required')">Nome é obrigatório</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>E-mail</mat-label>
        <input matInput formControlName="email" type="email" />
        <mat-error *ngIf="signupForm.get('email')?.hasError('required')">Email é obrigatório</mat-error>
        <mat-error *ngIf="signupForm.get('email')?.hasError('email')">Email inválido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Telefone</mat-label>
        <input matInput formControlName="telefone" mask="(00) 00000-0000" placeholder="(11) 99999-9999" />
        <mat-error *ngIf="signupForm.get('telefone')?.hasError('required')">Telefone é obrigatório</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput [type]="passwordVisibility['password'] ? 'password' : 'text'" formControlName="password" />
        <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility('password')">
          <mat-icon>{{ passwordVisibility['password'] ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="signupForm.get('password')?.hasError('required')">Senha é obrigatória</mat-error>
        <mat-error *ngIf="signupForm.get('password')?.hasError('minCaracteres')">Senha precisa ter ao menos 8 caracteres</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirmar senha</mat-label>
        <input matInput [type]="passwordVisibility['passwordConfirm'] ? 'password' : 'text'" formControlName="passwordConfirm" />
        <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility('passwordConfirm')">
          <mat-icon>{{ passwordVisibility['passwordConfirm'] ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="signupForm.get('passwordConfirm')?.hasError('required')">Confirmação obrigatória</mat-error>
        <mat-error *ngIf="signupForm.get('passwordConfirm')?.hasError('passwordMismatch')">Senhas não conferem</mat-error>
      </mat-form-field>

      <button type="submit" class="primary-action" [disabled]="signupForm.invalid">Cadastrar</button>

      <div class="divider" role="separator">Ou entre com:</div>

      <div class="socials">
        <button type="button" class="social google" aria-label="Google">
          <i nz-icon nzType="google" class="social-icon"></i>
        </button>
        <button type="button" class="social linkedin" aria-label="LinkedIn">
          <i nz-icon nzType="linkedin" class="social-icon"></i>
        </button>
      </div>

      <div class="signup-link">Já tem uma conta? <a (click)="irParaLogin()">Entre</a></div>
    </form>
  </div>
</app-default-login-layout>
