<app-default-login-layout>
  <div class="login-card">
    <div class="card-inner">
      <img src="/assets/png/LogoTavolaSimples.png" alt="logo" class="logo" />
      <h1 class="title">Bem-vindo de volta</h1>

      <form [formGroup]="loginForm" (ngSubmit)="realizarLogin()" class="login-form">
        <mat-form-field appearance="outline" class="full">
          <mat-label>E-mail</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="username">
          <mat-error *ngIf="loginForm.get('email')?.invalid">Digite um e‑mail válido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="senha" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('senha')?.invalid">Senha obrigatória</mat-error>
        </mat-form-field>

        <div class="forgot-row">
          <a href="#" (click)="forgotPassword(); $event.preventDefault();">Esqueceu a senha?</a>
        </div>

        <div *ngIf="showLoginError" class="login-error">Credenciais inválidas</div>

        <button class="btn-primary" type="submit" [disabled]="!loginForm.valid">Entrar</button>

        <div class="socials" aria-hidden="false">
          <button type="button" class="social google" aria-label="Google sign in">
            <i nz-icon nzType="google" class="social-icon"></i>
          </button>
          <button type="button" class="social linkedin" aria-label="LinkedIn sign in">
            <i nz-icon nzType="linkedin" class="social-icon"></i>
          </button>
        </div>

        <div class="signup-link">Não tem uma conta? <a (click)="irParaCadastro()">Cadastre-se</a></div>
      </form>
    </div>
  </div>
</app-default-login-layout>
