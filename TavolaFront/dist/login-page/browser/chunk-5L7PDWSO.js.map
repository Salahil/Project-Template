<app-default-login-layout>
  <div class="login-card page-card">
    <img src="/assets/png/LogoTavolaSimples.png" alt="Tavola" class="logo" />
    <h1 class="title">Bem-vindo de volta</h1>
    <p class="subtitle">Faça login na sua conta</p>

    <form [formGroup]="loginForm" (ngSubmit)="realizarLogin()" class="login-form page-form">
      <mat-form-field appearance="outline" class="full">
        <mat-label>E-mail ou telefone</mat-label>
        <input matInput formControlName="email" type="email" autocomplete="username" placeholder="Email ou telefone">
        <mat-error *ngIf="loginForm.get('email')?.invalid">Digite um e-mail válido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Senha</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="senha" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" aria-label="Alternar visibilidade da senha">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('senha')?.invalid">Senha obrigatória</mat-error>
      </mat-form-field>

      <div class="forgot-row">
        <a href="#" (click)="forgotPassword(); $event.preventDefault();" class="link-primary">Esqueceu a senha?</a>
      </div>

      <div *ngIf="showLoginError" class="login-error text-danger">Credenciais inválidas</div>

      <button class="btn-primary btn-primary-page" type="submit" [disabled]="!loginForm.valid">Entrar</button>

      <p class="divider">ou entre com</p>
      <div class="socials">
        <button type="button" class="social google" aria-label="Entrar com Google" (click)="signInWithGoogle()">
          <span class="google-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          </span>
          <span>Google</span>
        </button>
        <button type="button" class="social linkedin" aria-label="Entrar com LinkedIn">
          <span class="linkedin-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" fill="currentColor"/></svg>
          </span>
          <span>LinkedIn</span>
        </button>
      </div>

      <p class="signup-link link-muted">Não tem conta? <a (click)="irParaCadastro()" class="link-primary">Cadastre-se</a></p>
    </form>
  </div>
</app-default-login-layout>
