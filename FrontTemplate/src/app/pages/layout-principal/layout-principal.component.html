<div class="layout-container">
  <header class="toolbar" role="banner">
    <div class="toolbar-left">
      <div class="brand-inline" aria-hidden="true">
        <mat-icon class="brand-inline-icon">apps</mat-icon>
      </div>
      <button class="menu-toggle" (click)="toggleSidebar()" type="button" aria-label="Alternar sidebar">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
    </div>

    <div class="toolbar-right">
      <span class="user-name">{{ userName }}</span>
      <button mat-button (click)="logout()" type="button">
        <mat-icon>logout</mat-icon>
        Sair
      </button>
    </div>
  </header>

  <div class="main-wrapper">
    <aside class="desktop-sidebar" [class.fechada]="!sidebarAberta" role="navigation" aria-label="Menu lateral">
      <div class="sidebar-header">
        <div class="brand-inline brand-inline--sidebar" aria-hidden="true">
          <mat-icon class="brand-inline-icon">apps</mat-icon>
        </div>
      </div>
      <nav class="menu" role="navigation" aria-label="Menu principal">
        <button routerLink="/home" routerLinkActive="active" type="button">
          <mat-icon>home</mat-icon>
          <span>Início</span>
        </button>
      </nav>
    </aside>

    <main class="content" role="main"></main>
  </div>
</div>
